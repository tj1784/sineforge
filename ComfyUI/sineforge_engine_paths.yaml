# Loaded by the bundled BlokeyUI engine. Paths are relative to this file so
# the Sineforge workflow bridge stays portable with the repository.
sineforge:
  custom_nodes: .

# Keep downloaded weights in the merged application's BlokeyUI engine tree.
# This file is passed explicitly to ComfyUI by the Sineforge lifecycle manager.
sineforge_models:
  base_path: ../BlokeyUI/ComfyUI
  is_default: true
  checkpoints: models/checkpoints/
  clip: models/clip/
  clip_vision: models/clip_vision/
  configs: models/configs/
  controlnet: models/controlnet/
  diffusion_models: models/diffusion_models/
  embeddings: models/embeddings/
  gligen: models/gligen/
  hypernetworks: models/hypernetworks/
  loras: models/loras/
  photomaker: models/photomaker/
  style_models: models/style_models/
  text_encoders: models/text_encoders/
  unet: models/unet/
  upscale_models: models/upscale_models/
  vae: models/vae/
  vae_approx: models/vae_approx/
